# Development profile: use in-memory H2 database for local testing
spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dev/test dùng H2 + ddl-auto, KHÔNG chạy Flyway (migration SQL viết cho MySQL).
spring.flyway.enabled=false

# Keep other dev-friendly settings
spring.main.banner-mode=off
logging.level.org.hibernate.SQL=DEBUG

# Disable devtools restart: its RestartClassLoader makes Spring Data JPA
# scan 0 repositories on this JDK, breaking startup.
spring.devtools.restart.enabled=false
