# Docker profile: use MySQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/parking_building?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parkingpassword}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway: enable for Docker/production environment
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# JWT Security Settings
jwt.secret=${JWT_SECRET:changeMeToAStrongSecretKeyForJwtAtLeast256BitsLong}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1}

# Admin account
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.email=${APP_ADMIN_EMAIL:admin@parking.com}

# Manager account (tài khoản mẫu role MANAGER)
app.manager.username=${APP_MANAGER_USERNAME:manager}
app.manager.password=${APP_MANAGER_PASSWORD:Manager@123}
app.manager.email=${APP_MANAGER_EMAIL:manager@parking.com}

# Logging
logging.level.root=INFO
logging.level.com.parking=DEBUG
