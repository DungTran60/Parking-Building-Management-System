server.port=8080
spring.application.name=parking-building-management-system

# Mặc định chạy ở profile 'dev' để DataInitializer được phép dùng admin mật khẩu mặc định
# (guardAdminPassword chỉ bắt buộc ADMIN_PASSWORD ở prod - không có profile dev/test).
# Ở môi trường thật, ghi đè: SPRING_PROFILES_ACTIVE=prod + ADMIN_PASSWORD=<mat khau manh>.
spring.profiles.active=dev

# Database Configuration
# Thông tin kết nối được externalize qua biến môi trường, có giá trị mặc định cho môi trường local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# Schema do Flyway quản lý; Hibernate chỉ 'validate' (không tự sửa schema) để tránh mất dữ liệu.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true

# Flyway: quản lý schema migration cho MySQL (bật ở profile mặc định / production).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# baseline-on-migrate=true: nếu DB đã có sẵn dữ liệu (từ giai đoạn create-drop trước đây),
# Flyway sẽ đánh dấu baseline thay vì lỗi.
spring.flyway.baseline-on-migrate=true

# JWT Security Settings
# Ở production BẮT BUỘC override qua biến môi trường JWT_SECRET (secret này chỉ dùng cho dev/local).
# Nếu không set JWT_SECRET, dùng giá trị mặc định dev bên dưới để app vẫn khởi động được (HS256 cần key >= 32 byte).
jwt.secret=${JWT_SECRET:devjwtsecret_devjwtsecret_devjwtsecret_devjwtsecret_devjwt}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: danh sách origin của Frontend được phép gọi API (phân tách bằng dấu phẩy).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Tài khoản admin khởi tạo — override qua env ở môi trường thật (ADMIN_PASSWORD bắt buộc đổi).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@parking.com}

# Tài khoản manager khởi tạo — override qua env ở môi trường thật.
app.manager.username=${MANAGER_USERNAME:manager}
app.manager.password=${MANAGER_PASSWORD:Manager@123}
app.manager.email=${MANAGER_EMAIL:manager@parking.com}
