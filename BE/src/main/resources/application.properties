server.port=8080
spring.application.name=parking-building-management-system

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Security Settings
jwt.secret=${JWT_SECRET:9a72dfa5494f412496a7576572e9a562479e0bf84288b8e0e7a2cf1473fa58a4}
jwt.expiration-ms=86400000
