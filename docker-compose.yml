services:
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parking_building
      MYSQL_USER: parking
      MYSQL_PASSWORD: parkingpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uparking", "-pparkingpassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./BE
    container_name: parking-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/parking_building?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: parkingpassword
      JWT_SECRET: ${JWT_SECRET:-changeMeToAStrongSecretKeyForJwtAtLeast256BitsLong}
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@Parking2024Secure}
      APP_ADMIN_EMAIL: admin@parking.com
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
    image: nginx:1.27-alpine
    container_name: parking-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./FE/dist:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  mysql-data: